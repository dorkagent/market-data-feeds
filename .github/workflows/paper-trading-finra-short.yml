name: paper-trading-finra-short
on:
  schedule:
    - cron: '24 15 * * 1-5'  # weekdays 08:24 PT (15:24 UTC)
  workflow_dispatch:  # manual trigger
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run feed script
        run: python3 scripts/finra-short.py
      - name: Commit and push
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add hidden_files/finra-short/
          git diff --cached --quiet || git commit -m "paper-trading-finra-short $(date -u +%F)"
          git push

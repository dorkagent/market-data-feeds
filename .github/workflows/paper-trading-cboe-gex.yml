name: paper-trading-cboe-gex
on:
  schedule:
    - cron: '19 21 * * *'  # daily 14:19 PT (21:19 UTC)
  workflow_dispatch:  # manual trigger
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run feed script
        run: python3 scripts/cboe-gex.py
      - name: Commit and push
        run: |
          git config user.name "dorkagent"
          git config user.email "334435608+dorkagent@users.noreply.github.com"
          git add hidden_files/cboe-gex/
          git diff --cached --quiet || git commit -m "paper-trading-cboe-gex $(date -u +%F)"
          git push

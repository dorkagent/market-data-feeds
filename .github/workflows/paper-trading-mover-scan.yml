name: paper-trading-mover-scan
on:
  schedule:
    - cron: '55 12 * * 1-5'  # 5:55 AM PT (PDT, UTC-7) weekdays — feeds the 6:00 AM premarket scan
  workflow_dispatch:  # manual trigger
permissions:
  contents: write
concurrency:
  group: paper-trading-feeds-push
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run mover scan
        run: python3 scripts/mover-scan.py
      - name: Commit and push
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add hidden_files/mover-scan/
          git diff --cached --quiet || git commit -m "paper-trading-mover-scan $(date -u +%F_%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying in 15s"
            sleep 15
          done

name: paper-trading-finra-short-interest
on:
  schedule:
    - cron: '29 15 * * 1'  # Mon 08:29 PT (15:29 UTC)
  workflow_dispatch:  # manual trigger
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run feed script
        run: python3 scripts/finra-short-interest.py
      - name: Commit and push
        run: |
          git config user.name "dorkagent"
          git config user.email "334435608+dorkagent@users.noreply.github.com"
          git add hidden_files/finra-short-interest/
          git diff --cached --quiet || git commit -m "paper-trading-finra-short-interest $(date -u +%F)"
          git push
